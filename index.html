<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikeaDream 分批寄送資料建立</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
      :root { --primary: #d4a373; --primary-dark: #b07c4a; --text: #4a4a4a; --danger: #d63031; --success: #52b788; --line-green: #06c755; }
      body {
        font-family: 'Noto Sans TC', sans-serif;
        margin: 0; padding: 20px; color: var(--text);
        font-size: 16px; overflow-x: hidden;
        background: #fdf5e6;
        min-height: 100vh;
      }
      .container {
        max-width: 600px; margin: 0 auto;
        background: rgba(255, 255, 255, 0.98);
        padding: 25px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        padding-bottom: 80px;
      }
      h2 { text-align: center; color: #6b4f4f; margin-bottom: 5px; font-size: 20px; }
      .subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 20px; }

      label { display: block; margin-top: 10px; margin-bottom: 4px; font-weight: bold; color: #6b4f4f; font-size: 16px; }

      input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 16px; background: #fff; transition: border-color .25s, box-shadow .25s, transform .25s; }
      input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(212,163,115,.18); transform: translateY(-1px); }

      #hostInput { background-color: #fff8ee; border: 2px solid #e4dccb; color: #8c6b2d; font-weight: bold; }

      .card {
        background: #fff; border: 1px solid #eee; border-radius: 14px; padding: 20px; margin-bottom: 20px;
        position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid var(--primary);
        animation: softDrop .45s cubic-bezier(.34,1.56,.64,1);
      }
      .card-title { font-weight: bold; color: #aaa; font-size: 0.9rem; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }

      .btn-remove {
        position: absolute; top: 10px; right: 10px;
        background: #ffe5e5; color: #d63031; border: none;
        width: 30px; height: 30px; border-radius: 50%;
        font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      }
      .btn-remove { transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .15s; }
      .btn-remove:hover { background: #ffcccc; transform: scale(1.08); }
      .btn-remove:active { transform: scale(.9); }

      .notice-box {
        display: none;
        margin-top: 10px;
        padding: 10px;
        background-color: #fff0f0;
        border-left: 4px solid #d63031;
        border-radius: 10px;
        animation: softDrop .4s cubic-bezier(.34,1.56,.64,1);
        color: #d63031;
        font-size: 13px;
        line-height: 1.5;
        font-weight: bold;
      }

      .product-row {
        background: #fff; border: 1px solid #eee; padding: 10px; border-radius: 12px; margin-bottom: 8px; position: relative;
        animation: softDrop .4s cubic-bezier(.34,1.56,.64,1);
      }
      .btn-del-prod {
        position: absolute; right: -8px; top: -8px;
        background: #eee; color: #888; border: 1px solid #ddd; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 14px; line-height: 1;
      }
      .btn-del-prod:hover { background: #d63031; color: #fff; border-color: #d63031; }

      .btn-sm {
        padding: 8px 15px; font-size: 14px; background: #fff; border: 1px dashed #d4a373; color: #d4a373; border-radius: 20px; cursor: pointer; width: auto; display: inline-block;
        transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .15s;
      }
      .btn-sm:hover { background: #fff8ee; transform: translateY(-1px); }
      .btn-sm:active { transform: scale(.95); }

      .row { display: flex; gap: 10px; }
      .col-6 { flex: 1; } .col-8 { flex: 2; } .col-4 { flex: 1; }
      @media (max-width: 480px) {
        .row { flex-direction: column; }
        .col-6, .col-8, .col-4 { width: 100%; }
      }

      .spec-row { display: flex; gap: 5px; margin-top: 5px; display: none; animation: softDrop .4s cubic-bezier(.34,1.56,.64,1); }
      .spec-row select { font-size: 14px; padding: 8px; background: #f9f9f9; }

      .action-area { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }
      .btn { width: 100%; padding: 15px; border: none; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, border-bottom-width .1s; }
      .btn-add { background: #fff; border: 2px dashed #ccc; color: #888; }
      .btn-add:hover { transform: translateY(-1px); border-color: var(--primary); color: var(--primary); }
      .btn-add:active { transform: scale(.97); }
      /* 送出按鈕：3D 按壓（改編自 21st.dev Pop Button）+ hover 抬升 */
      .btn-submit { position: relative; background: var(--primary); color: white; border-bottom: 5px solid var(--primary-dark); box-shadow: 0 6px 14px rgba(212, 163, 115, 0.35); font-size: 18px; transform-origin: bottom; }
      .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 9px 20px rgba(212, 163, 115, 0.45); }
      .btn-submit:active:not(:disabled) { transform: translateY(2px) scaleY(.96); border-bottom-width: 2px; box-shadow: 0 3px 8px rgba(212, 163, 115, 0.3); }
      .btn-submit:disabled { opacity: .75; cursor: default; }
      .btn-outline { background: transparent; border: 1px solid #666; color: #666; margin-top: 10px; }
      .btn-outline:hover { transform: translateY(-1px); }
      .btn-outline:active { transform: scale(.97); }

      .success-card { text-align: center; padding: 10px 0; }
      .success-icon { font-size: 4rem; color: #b07c4a; margin-bottom: 15px; }
      .success-icon.sent { color: var(--success); }
      .success-title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 10px; }
      .success-desc { color: #6b4f4f; font-size: 16px; margin-bottom: 20px; }
      .stored-status { color: #6b4f4f; font-size: 16px; line-height: 1.6; margin: 0 0 18px; }
      .customer-action-card { display: none; text-align: left; margin: 0 0 20px; padding: 18px 16px; background: #fff5f5; border: 2px solid #d63031; border-radius: 16px; color: #4a2a2a; overflow-wrap: anywhere; }
      .customer-action-card.is-visible { display: block; }
      .customer-action-title { color: #b42318; font-size: 20px; font-weight: 700; line-height: 1.4; margin-bottom: 8px; animation: customerWarningNudge .6s ease-in-out 1; }
      .customer-action-warning { font-size: 16px; font-weight: 700; line-height: 1.6; margin: 0 0 8px; }
      .customer-action-instruction, .customer-action-prompt { font-size: 16px; line-height: 1.6; margin: 0 0 12px; }
      .customer-action-cta-wrap { position: sticky; bottom: 0; z-index: 4; margin: 12px -4px 0; padding: 12px 4px calc(12px + env(safe-area-inset-bottom)); background: rgba(255, 245, 245, 0.96); }
      .customer-action-cta { display: flex; width: 100%; min-height: 56px; box-sizing: border-box; align-items: center; justify-content: center; padding: 12px 16px; border-radius: 14px; background: #06c755; color: #fff; font-size: 18px; font-weight: 700; line-height: 1.35; text-align: center; text-decoration: none; box-shadow: 0 5px 14px rgba(6, 199, 85, 0.3); animation: customerCtaPulse .6s ease-in-out 3; }
      .customer-action-cta:active { transform: scale(.98); }
      .customer-action-prompt { color: #6b4f4f; text-align: center; margin: 10px 0 0; }
      .customer-action-card[data-state="sending"] .customer-action-title { color: #8c6b2d; }
      .customer-action-card[data-state="sending"] .customer-action-cta { animation: none; }
      .summary-details { margin-top: 8px; text-align: left; }
      .summary-details > summary { cursor: pointer; min-height: 48px; padding: 14px 16px; border: 1px solid #ddd; border-radius: 12px; background: #fff; color: #6b4f4f; font-size: 16px; font-weight: 700; }
      .summary-details[open] > summary { margin-bottom: 12px; }

      .order-summary { background: #f8f9fa; border-radius: 10px; padding: 20px; text-align: left; display: inline-block; width: 100%; box-sizing: border-box; border: 1px solid #eee; margin-bottom: 20px; }
      .summary-title { border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 10px; font-weight: bold; color: #555; }
      .summary-recipient { background: #fff; padding: 10px; border-radius: 5px; border: 1px solid #eee; margin-bottom: 10px; }
      .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; color: #444; }
      .summary-prod { font-size: 13px; color: #666; padding-left: 10px; border-left: 3px solid #d4a373; margin-top: 5px; }

      @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
      @keyframes customerWarningNudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
      @keyframes customerCtaPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
      .loader { display: inline-block; width: 16px; height: 16px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; vertical-align: -3px; animation: spin .7s linear infinite; margin-right: 8px; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .hide { display: none !important; }

      /* ===== 進場動畫（改編自 21st.dev Blur Fade：模糊+上浮+微彈，逐段錯開）===== */
      @keyframes blurFadeUp {
        from { opacity: 0; transform: translateY(16px) scale(.98); filter: blur(6px); }
        to   { opacity: 1; transform: translateY(0) scale(1);   filter: blur(0); }
      }
      .enter { animation: blurFadeUp .6s cubic-bezier(.22,.9,.35,1.15) both; animation-delay: calc(var(--i, 0) * 90ms); }
      @keyframes cakeWiggle { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-12deg) scale(1.15); } 45% { transform: rotate(10deg) scale(1.1); } 70% { transform: rotate(-5deg); } }
      .cake-emoji { display: inline-block; animation: cakeWiggle 1s ease-in-out .6s both; }

      /* 條件出現的區塊：軟著陸（.card / .product-row / .spec-row / .notice-box 共用） */
      @keyframes softDrop { from { opacity: 0; transform: translateY(-8px) scale(.97); } to { opacity: 1; transform: none; } }
      #manualCopyBox { animation: softDrop .4s cubic-bezier(.34,1.56,.64,1); }

      /* ===== 畫面切換轉場：表單淡出上飄 → 成功畫面果凍彈入 ===== */
      @keyframes viewOut { to { opacity: 0; transform: translateY(-20px) scale(.97); filter: blur(4px); } }
      .view-out { animation: viewOut .35s ease-in both; pointer-events: none; }
      @keyframes viewIn { from { opacity: 0; transform: translateY(30px) scale(.94); } 70% { transform: translateY(-4px) scale(1.01); } to { opacity: 1; transform: none; } }
      #successView.show { animation: viewIn .55s cubic-bezier(.34,1.56,.64,1) both; }
      #successView.show.customer-action-immediate { animation: none; opacity: 1; transform: none; }
      @keyframes iconPop { 0% { transform: scale(0) rotate(-30deg); } 55% { transform: scale(1.25) rotate(8deg); } 75% { transform: scale(.92) rotate(-3deg); } 100% { transform: scale(1) rotate(0); } }
      #successView.show .success-icon { animation: iconPop .7s cubic-bezier(.34,1.56,.64,1) .15s both; }
      .success-icon { display: inline-block; }

      /* 粒子（改編自 21st.dev Particle Button） */
      .burst-dot { position: fixed; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 9999; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>

    <div class="container" id="formView">
      <div id="liffStatus" style="font-size:12px; color:#ccc; text-align:center; margin-bottom:5px;">Loading...</div>
      <h2 class="enter" style="--i:0;"><span class="cake-emoji">🎁</span> 分批寄送資料建立</h2>
      <p class="subtitle enter" style="--i:1;">輸入完所有親友後，點擊最下方按鈕產生明細</p>

      <div class="enter" style="--i:2;">
        <label>訂購人 (媽咪姓名+手機末5碼)</label>
        <input type="text" id="hostInput" placeholder="例如：王小美23850">
      </div>

      <hr style="border:0; border-top:1px dashed #ddd; margin: 20px 0;">

      <div id="recipientList" class="enter" style="--i:3;"></div>

      <div class="action-area enter" style="--i:4;">
        <button type="button" class="btn btn-add" onclick="addCard()">＋ 新增下一位親友</button>
        <button type="button" class="btn btn-submit" onclick="prepareAndSubmit()" id="sBtn">
          🚀 全部輸入完畢，確認送出
        </button>
      </div>
    </div>

    <div class="container hide" id="successView">
      <div class="success-card">
        <i id="successIcon" class="bi bi-hourglass-split success-icon"></i>
        <div id="successTitle" class="success-title enter" style="--i:1;">資料已儲存</div>
        <p id="successDesc" class="success-desc enter" style="--i:2;">資料已儲存，正在回傳 LINE 訊息…</p>

        <div style="margin-top: 15px; margin-bottom: 25px;">
          <textarea id="copyArea" readonly style="position:absolute; left:-9999px;"></textarea>
          <div id="copyStatusMsg" class="stored-status enter" style="--i:3;">資料已儲存，正在回傳 LINE 訊息…</div>
          <div id="storeNotificationStatus" role="status" aria-live="polite" style="display:none; color:#8c6b2d; font-size:14px; line-height:1.5; margin:0 0 12px;"></div>
          <button id="retryStoreNotification" type="button" onclick="retryStoreNotification()" style="display:none; min-height:44px; margin:0 auto 14px; padding:10px 16px; border:1px solid #d4a373; border-radius:10px; background:#fff8ee; color:#8c6b2d;">重新確認店家通知</button>
          <div id="customerActionCard" class="customer-action-card" role="alert" aria-live="assertive" data-state="sending">
            <div id="customerActionTitle" class="customer-action-title">⚠️ 還差最後一步</div>
            <p id="customerActionWarning" class="customer-action-warning">訊息尚未回傳給我們，請務必按下下方『回 LINE 送出』按鈕。</p>
            <p id="customerActionInstruction" class="customer-action-instruction">回到 LINE 後請貼上完整內容並送出，我們才看得到。</p>
            <div id="manualCopyBox" style="display:none; margin-bottom:15px;">
              <div style="color:#b42318; font-weight:bold; font-size:16px; margin-bottom:10px; line-height:1.5;">
                請先複製分批明細，再回到 LINE 貼上
              </div>
              <button class="btn btn-submit" onclick="manualCopy()" type="button" style="background:#d4a373;">
                複製明細內容
              </button>
            </div>
            <div class="customer-action-cta-wrap">
              <a id="goToLineArea" href="https://lin.ee/oOteG0d" target="_blank" rel="noopener" class="customer-action-cta" onclick="startCustomerHandoff(event)">回 LINE 送出</a>
            <p id="customerActionPrompt" class="customer-action-prompt">進入 LINE 後，請貼上訊息並再按一次送出，我們才看得到。</p>
            </div>
          </div>
        </div>

        <details class="summary-details" style="--i:5;">
          <summary>查看分批寄送摘要</summary>
          <div class="order-summary" id="summaryBox"></div>
        </details>

        <div class="enter" style="--i:6; margin-top: 20px;">
           <button id="newFormButton" class="btn btn-outline" onclick="resetForm()">
             填寫下一張 / 修改
           </button>
        </div>
      </div>
    </div>

    <script>
      var FORM_SUBMISSIONS_API = "https://likeadreamcastella.zeabur.app/api/form-submissions";
      var FORM_RELAY_API = "https://likeadreamcastella.zeabur.app/api/form-relay";
      var BLOCKED_DATES_API = "https://likeadreamcastella.zeabur.app/api/blocked-dates";
      var FORM_ID = "batch";
      var blockedDates = [];
      var currentSubmissionId = null;
      var submissionBusy = false;
      var submissionSaveInFlight = false;
      var savedWithVerifiedIdentity = false;
      var AUTH_REQUIRED_MESSAGE = "請從 LINE 重新開啟表單並登入後再送出。";

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function loadBlockedDates() {
        fetch(BLOCKED_DATES_API)
          .then(function(res) { return res.ok ? res.json() : null; })
          .then(function(data) {
            var entries = (data && data.entries) || [];
            blockedDates = entries.filter(function(e) {
              return e && e.forms && e.forms.indexOf(FORM_ID) !== -1 && typeof e.start === 'string' && typeof e.end === 'string';
            });
            document.querySelectorAll('.r-date').forEach(function(el) {
              if (el.value) updateCardNotices(el);
            });
          })
          .catch(function() {});
      }

      function findBlockedEntry(dateStr) {
        for (var i = 0; i < blockedDates.length; i++) {
          var e = blockedDates[i];
          if (dateStr >= e.start && dateStr <= e.end) return e;
        }
        return null;
      }

      var currentUserId = "";
      var currentLineName = "";

      function createSubmissionId() {
        if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
        return 'submission-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
      }

      function stableSubmissionId() {
        if (!currentSubmissionId) currentSubmissionId = createSubmissionId();
        return currentSubmissionId;
      }

      function accessToken() {
        try { return (typeof liff !== 'undefined' && liff.getAccessToken) ? liff.getAccessToken() : null; } catch (e) { return null; }
      }

      function responseBody(response) {
        return Promise.resolve(response.text()).then(function(text) {
          var body = null;
          try { body = text ? JSON.parse(text) : null; } catch (e) { body = null; }
          return { response: response, body: body };
        });
      }

      function requestWithTimeout(url, init, timeoutMs, errorCode) {
        return new Promise(function(resolve, reject) {
          var settled = false;
          var timerId = setTimeout(function() {
            if (settled) return;
            settled = true;
            var timeout = new Error('request timeout'); timeout.code = errorCode; reject(timeout);
          }, timeoutMs);
          function finish(callback, value) { if (settled) return; settled = true; clearTimeout(timerId); callback(value); }
          var request;
          try { request = fetch(url, init); } catch (err) { finish(reject, err); return; }
          Promise.resolve(request)
            .then(function(value) { return responseBody(value); })
            .then(function(value) { finish(resolve, value); }, function(err) { finish(reject, err); });
        });
      }

      function saveSubmission(token, submissionId, payload) {
        if (!token) {
          var authError = new Error('submission requires LIFF authentication');
          authError.code = 'auth_required';
          return Promise.reject(authError);
        }
        if (submissionSaveInFlight) { var busy = new Error('submission save already in flight'); busy.code = 'save_pending'; return Promise.reject(busy); }
        submissionSaveInFlight = true;
        return requestWithTimeout(FORM_SUBMISSIONS_API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ accessToken: token, submissionId: submissionId, formType: FORM_ID, payload: payload })
        }, 5000, 'save_pending').then(function(result) {
          var body = result.body;
          if (result.response.status === 409) {
            var saveErrorCode = String(body && body.error ? body.error : '').toLowerCase();
            if (saveErrorCode === 'application_locked' || saveErrorCode.indexOf('duplicate') !== -1) {
              var locked = new Error(body && body.error ? String(body.error) : 'application_locked'); locked.code = 'locked'; throw locked;
            }
            var conflict = new Error('submission save pending'); conflict.code = 'save_pending'; throw conflict;
          }
          if (!result.response.ok || !body || body.status !== 'success' || body.submissionId !== submissionId || !Array.isArray(body.customerTexts) || body.customerTexts.length < 1 || body.customerTexts.some(function(text) { return typeof text !== 'string' || text.length < 1; })) {
            var pending = new Error('submission save response unavailable'); pending.code = 'save_pending'; throw pending;
          }
          return { verified: true, submissionId: submissionId, customerTexts: body.customerTexts.slice(), applicationNo: body.applicationNo || null };
        }).then(function(result) { submissionSaveInFlight = false; return result; }, function(err) { submissionSaveInFlight = false; throw err; });
      }

      function relayOperation(operation, submissionId, claimToken, failure) {
        var token = accessToken();
        if (!token) return Promise.reject(new Error('relay requires an authenticated token'));
        var body = { accessToken: token, submissionId: submissionId, formType: FORM_ID, operation: operation };
        if (claimToken) body.claimToken = claimToken;
        if (failure) body.failure = failure;
        return requestWithTimeout(FORM_RELAY_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }, 5000, 'relay_unknown').then(function(result) {
          if (!result.response.ok || !result.body || result.body.ok !== true || !result.body.customer) throw new Error('relay response unavailable');
          return result.body;
        });
      }

      function showStoreNotificationUnresolved() {
        var status = document.getElementById("storeNotificationStatus");
        var retry = document.getElementById("retryStoreNotification");
        status.innerText = "店家通知尚未確認，系統會保留這筆狀態。";
        status.style.display = "block";
        retry.style.display = "inline-block";
      }

      function notifyStore(submissionId) {
        return relayOperation('notify', submissionId).then(function(result) {
          var state = result && result.store && result.store.status;
          if (state === 'succeeded') {
            document.getElementById("storeNotificationStatus").innerText = "";
            document.getElementById("storeNotificationStatus").style.display = "none";
            document.getElementById("retryStoreNotification").style.display = "none";
          } else {
            showStoreNotificationUnresolved();
          }
          return result;
        }).catch(function(error) {
          showStoreNotificationUnresolved();
          return { ok: false, store: { status: 'unknown' }, error: error };
        });
      }

      function retryStoreNotification() {

      // ===== 粒子爆發（改編自 21st.dev Particle Button）=====
      function burstParticles(btn) {
        if (prefersReducedMotion()) return;
        var rect = btn.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var colors = ['#f8b4c4', '#d4a373', '#ffd97d', '#a8e6cf', '#fff'];
        for (var i = 0; i < 10; i++) {
          var el = document.createElement('div');
          el.className = 'burst-dot';
          el.style.left = cx + 'px';
          el.style.top = cy + 'px';
          el.style.background = colors[i % colors.length];
          document.body.appendChild(el);
          var dx = (i % 2 ? 1 : -1) * (Math.random() * 60 + 25);
          var dy = -Math.random() * 60 - 25;
          if (el.animate) {
            el.animate([
              { transform: 'translate(0,0) scale(0)', opacity: 1 },
              { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(1.1)', opacity: 1, offset: 0.5 },
              { transform: 'translate(' + (dx * 1.5) + 'px,' + (dy * 1.6) + 'px) scale(0)', opacity: 0 }
            ], { duration: 650, delay: i * 35, easing: 'ease-out' }).onfinish = (function(node) {
              return function() { node.remove(); };
            })(el);
          } else {
            el.remove();
          }
        }
      }

      // ===== 自動發送完整回執到 LINE，每批最多五則且不截斷 =====
      function buildLineMessages(text) {
        text = String(text == null ? '' : text);
        var result = [], chunk = '', chunkLength = 0;
        function pushChunk() {
          result.push({ type: 'text', text: chunk });
          chunk = '';
          chunkLength = 0;
        }
        function appendText(value) {
          for (var index = 0; index < value.length;) {
            var codePoint = value.codePointAt(index);
            var character = String.fromCodePoint(codePoint);
            var characterLength = character.length;
            if (chunkLength + characterLength > 5000) pushChunk();
            chunk += character;
            chunkLength += characterLength;
            index += characterLength;
          }
        }
        text.split('\n').forEach(function(line, index) {
          if (index > 0) appendText('\n');
          appendText(line);
        });
        if (chunkLength || result.length === 0) pushChunk();
        return result;
      }

      function messageTextsToMessages(texts) {
        var result = [];
        (texts || []).forEach(function(text) {
          buildLineMessages(String(text)).forEach(function(message) { result.push(message); });
        });
        return result;
      }

      function sendBatches(messages, done, failed) {
        var sent = 0;
        function next(offset) {
          if (offset >= messages.length) { done(); return; }
          var batch = messages.slice(offset, offset + 5), raw;
          try { raw = liff.sendMessages(batch); } catch (err) { err.sentCount = sent; failed(err); return; }
          var settled = false;
          var timer = setTimeout(function() {
            if (settled) return;
            settled = true;
            var timeout = new Error('sendMessages timeout'); timeout.code = 'send_unknown'; timeout.sentCount = sent; failed(timeout);
          }, 5000);
          Promise.resolve(raw).then(function() {
            if (settled) return;
            settled = true; clearTimeout(timer); sent += batch.length; next(offset + batch.length);
          }, function(err) {
            if (settled) return;
            settled = true; clearTimeout(timer); err.sentCount = sent; if (sent > 0) err.code = 'send_unknown'; failed(err);
          });
        }
        next(0);
      }

      function autoSendOrder(orderText, clipboardOk, submissionId, delivery) {
        var verified = delivery && delivery.verified === true;
        var messages = verified ? messageTextsToMessages(delivery.customerTexts) : buildLineMessages(orderText);
        function sendFailed(err) {
          if (!verified) { showCustomerActionRequired(clipboardOk); return; }
          var code = String(err && (err.code || err.name) || '').toUpperCase();
          var message = String(err && err.message || '').toLowerCase();
          var knownNoSendCode = code === '403' || code === 'PERMISSION_DENIED' || code === 'FORBIDDEN' ||
            code === 'NOT_SUPPORTED' || code === 'INVALID_MESSAGE' || code === 'INVALID';
          var knownNoSendMessage = message === "user doesn't grant required permissions yet";
          var failure = err && (err.sentCount > 0 || err.code === 'send_unknown') ? 'unknown' :
            (knownNoSendCode || knownNoSendMessage ? 'definite' : 'unknown');
          relayOperation('customer_failed', submissionId, delivery.claimToken, failure).then(function(result) {
            var state = result && result.customer && result.customer.status;
            if (!validCustomerState(result) || state === 'unknown' || state === 'sending') { showCustomerUnknown(); return; }
            if (state === 'failed' && failure === 'definite') {
              relayOperation('fallback', submissionId).then(function(fallback) {
                if (fallback.customer.status === 'succeeded' && fallback.customer.source === 'official') showOfficialRelaySuccess();
                else if (fallback.customer.status === 'unknown' || fallback.customer.status === 'sending') showCustomerUnknown();
                else if (fallback.customer.status === 'action_required') showCustomerActionRequired(clipboardOk);
                else showCustomerFailed(clipboardOk);
              }).catch(function() { showCustomerUnknown(); });
            } else showCustomerActionRequired(clipboardOk);
          }).catch(function() { showCustomerUnknown(); });
        }
        if (typeof liff === 'undefined') {
          if (verified) {
            relayOperation('fallback', submissionId).then(function(result) {
              if (result.customer.status === 'succeeded' && result.customer.source === 'official') showOfficialRelaySuccess();
              else if (result.customer.status === 'unknown' || result.customer.status === 'sending') showCustomerUnknown();
              else showCustomerActionRequired(clipboardOk);
            }).catch(function() { showCustomerUnknown(); });
          } else {
            sendFailed(new Error('LIFF unavailable'));
          }
          return;
        }
        var inClient = false;
        try { inClient = liff.isInClient() === true; } catch (e) { inClient = false; }
        if (!inClient) {
          if (!verified) { showCustomerActionRequired(clipboardOk); return; }
          relayOperation('fallback', submissionId).then(function(result) {
            if (result.customer.status === 'succeeded' && result.customer.source === 'official') showOfficialRelaySuccess();
            else if (result.customer.status === 'unknown' || result.customer.status === 'sending') showCustomerUnknown();
            else showCustomerActionRequired(clipboardOk);
          }).catch(function() { showCustomerUnknown(); });
          return;
        }
        if (!verified) { sendBatches(messages, function() { showCustomerSentSuccess(); }, sendFailed); return; }
        relayOperation('customer_start', submissionId).then(function(started) {
          var state = started && started.customer && started.customer.status;
          if (state === 'succeeded') { if (started.customer.source === 'official') showOfficialRelaySuccess(); else showCustomerSentSuccess(); return; }
          if (state !== 'sending' || !started.claimToken) { if (state === 'unknown' || state === 'sending') showCustomerUnknown(); else if (state === 'failed') showCustomerFailed(clipboardOk); else showCustomerActionRequired(clipboardOk); return; }
          delivery.claimToken = started.claimToken;
          sendBatches(messages, function() {
            relayOperation('customer_sent', submissionId, delivery.claimToken).then(function(sent) {
              var sentState = sent && sent.customer && sent.customer.status;
              if (sentState === 'succeeded' && sent.customer.source === 'official') showOfficialRelaySuccess();
              else if (sentState === 'succeeded') showCustomerSentSuccess();
              else showCustomerUnknown();
            }).catch(function() { showCustomerUnknown(); });
          }, sendFailed);
        }).catch(function() { showCustomerUnknown(); });
      }

      function showCustomerSentSuccess() {
        var actionCard = document.getElementById("customerActionCard");
        actionCard.classList.remove("is-visible");
        actionCard.setAttribute("data-state", "succeeded");
        document.getElementById("successView").classList.remove("customer-action-immediate");
        document.getElementById("successIcon").className = "bi bi-check-circle-fill success-icon sent";
        document.getElementById("successTitle").innerText = "分批明細訊息已送出！";
        document.getElementById("successDesc").innerText = "表單資料已儲存，分批明細訊息已回傳給我們。";
        document.getElementById("copyStatusMsg").innerHTML = '<span style="color:#28a745; font-size:18px;">✅ 分批明細已自動傳送至聊天室！</span>';
        document.getElementById("manualCopyBox").style.display = "none";
        document.getElementById("goToLineArea").style.display = "none";
        document.getElementById("newFormButton").style.display = "block";
        fireConfetti();
      }

      function showOfficialRelaySuccess() {
        var actionCard = document.getElementById("customerActionCard");
        actionCard.classList.remove("is-visible");
        actionCard.setAttribute("data-state", "succeeded");
        document.getElementById("successIcon").className = "bi bi-check-circle-fill success-icon sent";
        document.getElementById("successTitle").innerText = "官方帳號已代傳完整資料";
        document.getElementById("successDesc").innerText = "官方帳號已代傳完整資料，請回 LINE 核對";
        document.getElementById("copyStatusMsg").innerText = "官方帳號已代傳完整資料，請回 LINE 核對";
        document.getElementById("manualCopyBox").style.display = "none";
        document.getElementById("goToLineArea").style.display = "none";
        document.getElementById("newFormButton").style.display = "block";
        fireConfetti();
      }

      function showCustomerUnknown() {
        var actionCard = document.getElementById("customerActionCard");
        actionCard.classList.add("is-visible");
        actionCard.setAttribute("data-state", "unknown");
        document.getElementById("customerActionTitle").innerText = "訊息狀態待確認";
        document.getElementById("successView").classList.add("customer-action-immediate");
        document.getElementById("successIcon").className = "bi bi-hourglass-split success-icon";
        document.getElementById("successTitle").innerText = "正在確認訊息狀態";
        document.getElementById("successDesc").innerText = "LINE 回傳狀態尚未確認，請勿重複送出。";
        document.getElementById("copyStatusMsg").innerText = "正在確認 LINE 訊息狀態，請勿重複送出。";
        document.getElementById("manualCopyBox").style.display = "none";
        document.getElementById("goToLineArea").style.display = "none";
        document.getElementById("newFormButton").style.display = "none";
        document.getElementById("customerActionWarning").style.display = "none";
        document.getElementById("customerActionInstruction").style.display = "none";
        document.getElementById("customerActionPrompt").style.display = "none";
      }

      function showCustomerFailed(clipboardOk) {
        showCustomerActionRequired(clipboardOk);
        document.getElementById("customerActionCard").setAttribute("data-state", "failed");
        document.getElementById("successDesc").innerText = "訊息回傳失敗，請依下方步驟完成。";
      }

      function showCustomerActionRequired(clipboardOk) {
        var actionCard = document.getElementById("customerActionCard");
        actionCard.classList.add("is-visible");
        actionCard.setAttribute("data-state", "action_required");
        document.getElementById("customerActionTitle").innerText = "⚠️ 還差最後一步";
        var successView = document.getElementById("successView");
        successView.classList.add("customer-action-immediate");
        document.getElementById("successIcon").className = "bi bi-exclamation-triangle-fill success-icon";
        document.getElementById("successTitle").innerText = "資料已儲存";
        document.getElementById("successDesc").innerText = "資料已儲存，但 LINE 訊息尚未完成回傳。";
        document.getElementById("copyStatusMsg").innerText = "訊息尚未回傳給我們，請務必按下下方『回 LINE 送出』按鈕。";
        document.getElementById("manualCopyBox").style.display = clipboardOk ? "none" : "block";
        document.getElementById("goToLineArea").style.display = "flex";
        document.getElementById("customerActionWarning").style.display = "block";
        document.getElementById("customerActionInstruction").style.display = "block";
        document.getElementById("customerActionPrompt").style.display = "block";
      }

      function startCustomerHandoff(event) {
        var text = document.getElementById("copyArea").value;
        var copied = fallbackCopy(text);
        if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
          try { navigator.clipboard.writeText(text).catch(function() {}); } catch (e) {}
        }
        var actionCard = document.getElementById("customerActionCard");
        if (!savedWithVerifiedIdentity || !currentSubmissionId) {
          actionCard.setAttribute("data-state", "action_required");
          document.getElementById("copyStatusMsg").innerText = "訊息尚未回傳給我們，請務必按下下方『回 LINE 送出』按鈕。";
          return;
        }
        if (event && event.preventDefault) event.preventDefault();
        actionCard.setAttribute("data-state", "sending");
        document.getElementById("copyStatusMsg").innerText = "正在保留這筆回傳狀態，請稍候再回 LINE。";
        var handoffUrl = document.getElementById("goToLineArea").href;
        relayOperation('customer_start', currentSubmissionId).then(function(result) {
          var customer = result && result.customer || {};
          if (customer.status === 'succeeded') {
            if (customer.source === 'official') showOfficialRelaySuccess();
            else showCustomerSentSuccess();
          } else if (customer.status === 'sending' && result.claimToken && customer.source === 'client') {
            showCustomerUnknown();
            try { window.open(handoffUrl, '_blank', 'noopener'); } catch (e) {}
          } else if (customer.status === 'unknown' || customer.status === 'sending') {
            showCustomerUnknown();
          } else {
            showCustomerActionRequired(true);
          }
        }).catch(function() { showCustomerUnknown(); });
      }

      function showCopyResult(clipboardOk) {
        showCustomerActionRequired(clipboardOk);
      }

      // ===== iOS LINE 瀏覽器相容的複製方法 =====
      function fallbackCopy(text) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '0';
          ta.setAttribute('readonly', '');
          document.body.appendChild(ta);
          ta.focus();
          ta.setSelectionRange(0, ta.value.length);
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch(e) {
          return false;
        }
      }

      function showManualCopyFallback(text) {
        var copyArea = document.getElementById("copyArea");
        copyArea.value = text;
        copyArea.readOnly = true;
        copyArea.setAttribute("readonly", "");
        copyArea.style.position = "static";
        copyArea.style.left = "auto";
        copyArea.style.top = "auto";
        copyArea.style.display = "block";
        copyArea.style.visibility = "visible";
        copyArea.style.opacity = "1";
        copyArea.style.width = "100%";
        copyArea.style.minHeight = "180px";
        copyArea.style.boxSizing = "border-box";
        copyArea.style.padding = "12px";
        copyArea.style.fontSize = "16px";
        copyArea.style.lineHeight = "1.5";
        copyArea.style.whiteSpace = "pre-wrap";
        copyArea.style.userSelect = "text";
        copyArea.style.webkitUserSelect = "text";
        document.getElementById("manualCopyBox").style.display = "block";
        document.getElementById("copyStatusMsg").innerHTML =
          '<span style="color:#b42318;">複製功能暫時不可用，請直接長按下方內容選取並複製，再回到 LINE 貼上。</span>';
        try {
          copyArea.focus();
          copyArea.select();
        } catch (e) {}
      }

      function manualCopy() {
        var text = document.getElementById("copyArea").value;
        function useFallback() {
          var copied = false;
          try { copied = fallbackCopy(text); } catch (e) {}
          if (copied) onCopySuccess();
          else showManualCopyFallback(text);
        }
        var clipboard = typeof navigator !== "undefined" ? navigator.clipboard : null;
        if (!clipboard || typeof clipboard.writeText !== "function") {
          useFallback();
          return;
        }
        var writePromise;
        try {
          writePromise = clipboard.writeText(text);
        } catch (e) {
          useFallback();
          return;
        }
        Promise.resolve(writePromise).then(function() {
          onCopySuccess();
        }, function() {
          useFallback();
        });
      }

      function onCopySuccess() {
        document.getElementById("copyStatusMsg").innerHTML =
          '<span style="color:#28a745;">✅ 明細內容已複製！</span><br>' +
          '<span style="color:#d63031; font-size:14px;">請點擊下方按鈕，前往 LINE 貼上回傳</span>';
        document.getElementById("manualCopyBox").style.display = "none";
      }

      function resetForm() {
        var actionCard = document.getElementById("customerActionCard");
        if (actionCard.getAttribute("data-state") !== "succeeded" || submissionSaveInFlight) return;
        currentSubmissionId = null;
        savedWithVerifiedIdentity = false;
        submissionBusy = false;
        document.getElementById("successView").classList.add("hide");
        document.getElementById("successView").classList.remove("show");
        document.getElementById("successView").classList.remove("customer-action-immediate");
        document.getElementById("formView").classList.remove("hide");
        document.getElementById("formView").classList.remove("view-out");
        document.getElementById("copyStatusMsg").innerHTML = "";
        document.getElementById("manualCopyBox").style.display = "none";
        document.getElementById("storeNotificationStatus").style.display = "none";
        document.getElementById("retryStoreNotification").style.display = "none";

        document.getElementById("recipientList").innerHTML = "";

        var btn = document.getElementById("sBtn");
        btn.disabled = false;
        btn.innerHTML = '🚀 全部輸入完畢，確認送出';

        addCard();
        window.scrollTo(0, 0);
      }
    </script>
